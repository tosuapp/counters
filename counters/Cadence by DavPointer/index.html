<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cadence</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <div id="counter">
      <!-- left column: the live pp over the hit chips -->
      <div id="inner">
        <div class="row main">
          <span id="liveWrap" class="pp">
            <span id="ppLive" class="value">0</span><span class="unit">pp</span>
          </span>
        </div>

        <!-- every hit is just its value on a coloured chip, best judgement first: 300 100 50 miss -->
        <div id="subRow" class="row sub">
          <span id="hit300" class="hit"><span id="v300" class="value">0</span></span>
          <span id="hit100" class="hit"><span id="v100" class="value">0</span></span>
          <span id="hit50" class="hit"><span id="v50" class="value">0</span></span>
          <span id="hitMiss" class="hit"><span id="vMiss" class="value">0</span></span>
        </div>

        <!-- how far the map has come: one thin line under the chips, filled up to the last object -->
        <div id="barRow" class="bar"><div id="barFill"></div></div>
      </div>
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
